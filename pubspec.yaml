name: image_ffi
description: >-
  Fast native image resize, thumbnail and JPEG/PNG encode for Dart over FFI.
  Several times quicker than the pure-Dart image package; stb-backed, no
  prebuilt binary.
version: 1.2.7
repository: https://github.com/Yusufihsangorgel/image_ffi

topics:
  - image
  - resize
  - jpeg
  - thumbnail
  - ffi

screenshots:
  - description: "Median milliseconds to decode, resize and encode a 2000x2000 image: the full thumbnail pipeline takes 27.3 ms against the pure-Dart image package's 141.7."
    path: doc/benchmark.png
  - description: >-
      The same checkerboard shrunk to one pixel: resampling in light gives 188,
      the honest grey, and skipping that conversion gives 127.
    path: doc/gamma-resize.png
environment:
  sdk: ^3.10.0

# Android and iOS run the on-device test on an emulator and a simulator in
# flutter-compat.yaml. Linux, macOS and Windows run the Dart VM tests. The
# package uses dart:ffi and does not run on the web.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  ffi: ^2.1.0
  hooks: '>=2.0.2 <3.0.0'
  code_assets: '>=1.2.1 <3.0.0'
  native_toolchain_c: '>=0.19.2 <0.20.0'

dev_dependencies:
  # Needs archive 3.6.1 or newer. archive 3.5 and older use typed-data view
  # classes that Dart 3.5 removed, and image 4.0 to 4.2 allow those archives.
  image: ^4.3.0
  # Lower bounds that `dart pub downgrade` can build and run. test 1.25 and
  # 1.26 resolve analyzer 6.1 or older, which needs watcher 1.0.0, and that does
  # not compile on current SDKs.
  test: ^1.27.0
  # package:test allows frontend_server_client 3.x, which starts a frontend
  # server snapshot that 64-bit SDKs do not ship.
  frontend_server_client: ^4.0.0
  lints: ^6.0.0
