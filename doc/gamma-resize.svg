<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <rect width="100%" height="100%" fill="#14161C"/>
  <text x="40" y="36" fill="#d8dee9" font-size="15" font-family="Menlo, monospace">the same checkerboard, shrunk to one pixel</text>
  <text x="40" y="56" fill="#8b93a3" font-size="11.5" font-family="Menlo, monospace">half black, half white, so the honest answer is the grey that emits half the light: 188</text>
  <rect x="40.0" y="88" width="200.0" height="130" fill="#bcbcbc" rx="3"/>
  <text x="140.0" y="240" fill="#d8dee9" font-size="12" font-family="Menlo, monospace" text-anchor="middle">ResizeColorSpace.srgb</text>
  <text x="140.0" y="260" fill="#8b93a3" font-size="11.5" font-family="Menlo, monospace" text-anchor="middle">188, the light-correct grey</text>
  <rect x="300.0" y="88" width="200.0" height="130" fill="#7f7f7f" rx="3"/>
  <text x="400.0" y="240" fill="#d8dee9" font-size="12" font-family="Menlo, monospace" text-anchor="middle">ResizeColorSpace.linear</text>
  <text x="400.0" y="260" fill="#8b93a3" font-size="11.5" font-family="Menlo, monospace" text-anchor="middle">127, -61 too dark</text>
  <text x="40" y="288" fill="#8b93a3" font-size="11" font-family="Menlo, monospace">both are one call to resizePixels; the argument is the whole difference, and srgb is the default</text>
</svg>
